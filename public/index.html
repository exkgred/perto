<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#143d2c" />
    <meta name="description" content="Acha comércio por perto e mostra a fonte de cada resultado." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Perto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Perto</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="/icon.svg" alt="" width="36" height="36" />
        <div>
          <h1>Perto</h1>
          <p>O card só mostra o que a fonte devolveu.</p>
        </div>
      </div>
      <div class="acoes">
        <button id="loc-btn" type="button">Usar minha localização</button>
        <button id="atalho" type="button" hidden>Adicionar à tela inicial</button>
      </div>
      <p id="loc-status" class="status">Sem GPS. Dá para buscar dizendo a cidade.</p>
      <p id="fontes" class="fontes"></p>
    </header>

    <main id="thread" class="thread" aria-live="polite">
      <section class="intro">
        <p>Pede qualquer coisa: comércio, encanador, diarista, pedreiro, aula particular. O card mostra só o que a fonte devolveu.</p>
        <div class="sugestoes">
          <button type="button" data-sugestao="Encanador em Almirante Tamandaré">Encanador</button>
          <button type="button" data-sugestao="Diarista em Almirante Tamandaré">Diarista</button>
          <button type="button" data-sugestao="Aula particular de inglês em Curitiba">Aula de inglês</button>
          <button type="button" data-sugestao="Borracharia aberta agora em Almirante Tamandaré">Borracharia</button>
        </div>
      </section>
    </main>

    <form id="composer" class="composer">
      <label class="sr" for="mensagem">Mensagem</label>
      <textarea id="mensagem" rows="1" placeholder="Ex.: pedreiro, diarista, aula de inglês" required></textarea>
      <button type="submit">Buscar</button>
    </form>
    <dialog id="atalho-ajuda">
      <p id="atalho-texto"></p>
      <button type="button" id="atalho-fechar">Entendi</button>
    </dialog>
    <script src="/app.js" type="module"></script>
  </body>
</html>
