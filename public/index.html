<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#143d2c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="description" content="Acha comércio por perto e mostra a fonte de cada resultado." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Perto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Perto</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <div class="brand">
          <img src="/icon.svg" alt="" width="36" height="36" />
          <div>
            <h1>Perto</h1>
            <p id="loc-status" class="status">Sem GPS. Diga a cidade.</p>
          </div>
        </div>
        <div class="acoes">
          <button id="loc-btn" type="button" aria-label="Usar minha localização">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          </button>
          <button id="atalho" type="button" hidden aria-label="Adicionar à tela inicial">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M11 3h2v10.2l3.3-3.3 1.4 1.4L12 17.1 6.3 11.3l1.4-1.4 3.3 3.3V3zM5 19h14v2H5z"/></svg>
          </button>
        </div>
      </div>
      <p id="fontes" class="fontes" hidden></p>
    </header>

    <main id="thread" class="thread" aria-live="polite">
      <section class="intro">
        <img src="/icon.svg" alt="" width="64" height="64" />
        <p>O que você precisa agora?</p>
        <p class="sub">Eu escolho onde procurar e trago o mais perto.</p>
        <div class="sugestoes">
          <button type="button" data-sugestao="preciso de pão">Pão</button>
          <button type="button" data-sugestao="quero vinho">Vinho</button>
          <button type="button" data-sugestao="farmácia aberta agora">Farmácia</button>
          <button type="button" data-sugestao="borracharia">Borracharia</button>
        </div>
      </section>
    </main>

    <form id="composer" class="composer">
      <label class="sr" for="mensagem">Mensagem</label>
      <textarea id="mensagem" rows="1" placeholder="Pão, vinho, farmácia, encanador…" required></textarea>
      <button type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M3.4 10.7 20.2 3.2c.8-.3 1.6.5 1.3 1.3l-7.5 16.8c-.3.8-1.5.7-1.7-.1l-2.2-7.1-7.1-2.2c-.8-.2-.9-1.4-.1-1.7z"/>
        </svg>
      </button>
    </form>
    <dialog id="atalho-ajuda">
      <p id="atalho-texto"></p>
      <button type="button" id="atalho-fechar">Entendi</button>
    </dialog>
    <script src="/app.js" type="module"></script>
  </body>
</html>
